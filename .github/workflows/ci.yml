# Builds, tests and lints on every push and pull request. It does not sign or publish anything:
# releases stay manual (see README, "Releasing": scripts/build-release.sh and `gh release create`).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # ffmpeg lets FfmpegCompatTest decode the muxer's output with a real decoder; without it the test is skipped.
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Android SDK components
        run: |
          set +o pipefail   # `yes` is cut off by sdkmanager, which would fail the pipe
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      # Lint fails the build on errors only (for example an API newer than minSdk); warnings are reported.
      - name: Unit tests, lint and debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
